[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniaudit-geo"
version = "1.0.0"
description = "Enterprise Brand AI-Readiness, GEO/AEO Audit Marketplace & Anthropic MCP Server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Shaswat Raj", email = "shaswatraj3@gmail.com" },
  { name = "Prithvi" }
]
keywords = [
  "seo",
  "geo",
  "aeo",
  "generative-engine-optimization",
  "mcp",
  "model-context-protocol",
  "agentskills",
  "ai-discoverability",
  "brand-audit"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

dependencies = []

[project.optional-dependencies]
web = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "streamlit>=1.38.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0"
]
dev = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "streamlit>=1.38.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "ruff>=0.5.0"
]

[project.scripts]
omniaudit = "cli:main"
omni = "cli:main"

[project.urls]
Homepage = "https://omniaudit-geo.onrender.com/"
Repository = "https://github.com/SH20RAJ/omniaudit"
Documentation = "https://omniaudit-geo.onrender.com/docs"

[tool.setuptools]
py-modules = ["cli", "app"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".ruff_cache",
    "omniaudit_geo.egg-info",
    "artifacts",
    "context",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line-too-long
    "B008",   # function call in argument defaults (FastAPI Query/Depends)
    "B904",   # raise ... from err in exception handlers
    "EXE001", # Shebang is present but file is not executable
    "E402",   # Module level import not at top of file (sys.path manipulation)
    "B905",   # zip() without an explicit strict= parameter
]

[tool.ruff.lint.isort]
known-first-party = [
    "audit_runner",
    "safe_fetch",
    "mcp_server",
    "audit_guard",
    "docs_manager",
    "seo_config",
    "cli"
]

[tool.pyright]
include = ["omniaudit-geo", "skills", "scripts", "cli.py", "app.py"]
extraPaths = [
    ".",
    "scripts",
    "omniaudit-geo",
    "skills/audit-orchestrator/scripts",
    "skills/crawl-render-audit/scripts",
    "skills/structured-entity-audit/scripts",
    "skills/aeo-quotability-audit/scripts",
    "skills/freshness-corroboration-audit/scripts",
    "skills/on-site-engagement-audit/scripts"
]

